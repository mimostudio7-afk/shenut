<body class="bg-[#f9fafb] text-[#111827]">

                moisturizer: { name: 'مرطب بشرة (عبوة)', price: 120, stock: 10 },
                perfume: { name: 'عطر (عبوة)', price: 350, stock: 8 },
                lipstick: { name: 'أحمر شفاه', price: 110, stock: 20 },

        function App() {
            const [activeTab, setActiveTab] = useState('products');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState(false);

            const [isSubscribed, setIsSubscribed] = useState(false);

            const handleAdminClick = () => {
                if (isAdminMode) {
                    setIsAdminMode(false);
                    setActiveTab('products');
                } else {
                    setShowPasswordModal(true);
                    setPasswordInput('');
                    setPasswordError(false);
                }
            };

            const verifyPassword = (e) => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) {
                    setIsAdminMode(true);
                    setShowPasswordModal(false);
                    setPasswordError(false);
                    setActiveTab('admin');
                } else {
                    setPasswordError(true);
                }
            };

            return (

                            <button onClick={handleAdminClick} className={`px-3.5 py-1.5 rounded-xl font-medium flex items-center gap-1 shadow-sm ${isAdminMode ? 'bg-indigo-700 text-white' : 'bg-indigo-800 text-white'}`}>

                            </button>
                            <button onClick={() => setShowProfileModal(true)} className="text-gray-700 px-2 py-1 rounded">بياناتي</button>
                        </div>
                    </header>

                    {showPasswordModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-lg font-bold mb-2 text-gray-800">كلمة مرور لوحة التحكم</h3>
                                <p className="text-xs text-gray-500 mb-4">أدخل كلمة المرور الخاصة للوصول إلى لوحة تحكم المالك.</p>
                                <form onSubmit={verifyPassword}>
                                    <input 
                                        type="password" 
                                        value={passwordInput} 
                                        onChange={(e) => setPasswordInput(e.target.value)} 
                                        placeholder="أدخل كلمة المرور..." 
                                        className="w-full border p-3 rounded-xl mb-2 text-black focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        autoFocus
                                    />
                                    {passwordError && <p className="text-red-500 text-xs mb-2">كلمة المرور غير صحيحة، حاول مرة أخرى.</p>}
                                    <div className="flex justify-end gap-2 mt-4">
                                        <button type="button" onClick={() => setShowPasswordModal(false)} className="px-4 py-2 bg-gray-100 rounded-xl text-gray-700 text-sm">إلغاء</button>
                                        <button type="submit" className="px-4 py-2 bg-indigo-700 text-white rounded-xl text-sm font-bold">دخول</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 p-4 max-w-4xl mx-auto w-full">
                        {activeTab === 'products' && (
                            <div>
                                <h2 className="text-xl font-semibold mb-4 text-gray-800">قائمة المنتجات والسلع</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {Object.entries(products.grocery).map(([key, item]) => (
                                        <div key={key} className="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">

                                                <h4 className="font-bold text-gray-800">{item.name}</h4>

                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'admin' && isAdminMode && (
                            <div>
                                <h2 className="text-xl font-bold mb-4 text-gray-800 flex items-center gap-2">
                                    <span>لوحة تحكم المالك</span> 🛠️
                                </h2>

                                    <div className="bg-white p-5 rounded-2xl shadow-sm border text-center">

                                        <h3 className="text-2xl font-bold text-gray-800">0</h3>
