<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شنوت - SHENUT</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #fcf8f2; color: #2c221e; } 
        .pharaoh-header { background: linear-gradient(135deg, #1b365d 0%, #0f1f38 100%); border-bottom: 3px solid #d4af37; }
        .pharaoh-btn { background-color: #d4af37; color: #1b365d; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const APP_NAME = 'شنوت - SHENUT';
        const OWNER_WHATSAPP_NUMBER = '201030566422';
        const ADMIN_PASSWORD = 'tashwish_281';

        const INITIAL_PRODUCTS = {
            grocery: {
                item1: { name: 'رز فاخر (كجم)', price: 30, stock: 50 },
                item2: { name: 'مكرونة (كيس)', price: 10, stock: 100 },
                item3: { name: 'دقيق (كجم)', price: 18, stock: 30 },
                item4: { name: 'زيت طعام (لتر)', price: 90, stock: 20 },
                item5: { name: 'سمن بلدي (كجم)', price: 300, stock: 10 },
                item6: { name: 'سكر (كجم)', price: 27, stock: 40 },
            },
            cosmetics: {
                c1: { name: 'شامبو شعر (عبوة)', price: 85, stock: 15 },
                c2: { name: 'بلسم شعر (عبوة)', price: 80, stock: 15 },
                c3: { name: 'مرطب بشرة (عبوة)', price: 120, stock: 10 },
                c4: { name: 'عطر ملكي (عبوة)', price: 350, stock: 8 },
            }
        };

        function App() {
            const [tab, setTab] = useState('grocery');
            const [isAdmin, setIsAdmin] = useState(false);
            const [showModal, setShowModal] = useState(false);
            const [pass, setPass] = useState('');
            const [error, setError] = useState(false);
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [cart, setCart] = useState([]);
            const [subscribers, setSubscribers] = useState([
                { id: 1, name: 'محمود حسن', phone: '01000000000', plan: 'برنامج التنشيف' }
            ]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (pass === ADMIN_PASSWORD) {
                    setIsAdmin(true);
                    setShowModal(false);
                    setTab('admin');
                    setError(false);
                } else {
                    setError(true);
                }
            };

            const addToCart = (key, item) => {
                setCart(prev => {
                    const exist = prev.find(i => i.key === key);
                    if (exist) {
                        return prev.map(i => i.key === key ? {...i, qty: i.qty + 1} : i);
                    }
                    return [...prev, { key, name: item.name, price: item.price, qty: 1 }];
                });
                alert(`تمت إضافة "${item.name}" للسلة بنجاح!`);
            };

            const updateQty = (key, delta) => {
                setCart(prev => prev.map(i => i.key === key ? {...i, qty: i.qty + delta} : i).filter(i => i.qty > 0));
            };

            const getTotal = () => cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const sendWhatsApp = () => {
                if (cart.length === 0) return;
                let msg = "طلب جديد من تطبيق شنوت - SHENUT:\n\n";
                cart.forEach((i, idx) => {
                    msg += `${idx + 1}. ${i.name} × ${i.qty} = ${i.price * i.qty} ج.م\n`;
                });
                msg += `\nالإجمالي النهائي: ${getTotal()} ج.م`;
                window.open(`https://wa.me/${OWNER_WHATSAPP_NUMBER}?text=` + encodeURIComponent(msg), '_blank');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="pharaoh-header text-white p-3.5 flex flex-wrap justify-between items-center gap-2">
                        <h1 className="text-lg font-bold text-[#ffd700]">𓋹 شنوت SHENUT</h1>
                        <div className="flex flex-wrap gap-2 text-sm">
                            <button onClick={() => setTab('grocery')} className={`px-3 py-1.5 rounded-lg ${tab === 'grocery' ? 'bg-[#d4af37] text-[#1b365d] font-bold' : 'bg-white/10'}`}>السلع</button>
                            <button onClick={() => setTab('cosmetics')} className={`px-3 py-1.5 rounded-lg ${tab === 'cosmetics' ? 'bg-[#d4af37] text-[#1b365d] font-bold' : 'bg-white/10'}`}>التجميل</button>
                            <button onClick={() => setTab('fitness')} className={`px-3 py-1.5 rounded-lg ${tab === 'fitness' ? 'bg-[#d4af37] text-[#1b365d] font-bold' : 'bg-white/10'}`}>اللياقة</button>
                            <button onClick={() => setTab('cart')} className={`px-3 py-1.5 rounded-lg relative ${tab === 'cart' ? 'bg-[#d4af37] text-[#1b365d] font-bold' : 'bg-white/10'}`}>
                                السلة 🛒 {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">{cart.reduce((a,c)=>a+c.qty,0)}</span>}
                            </button>
                            <button onClick={() => { if(isAdmin) setTab('admin'); else { setShowModal(true); setPass(''); setError(false); } }} className="px-3.5 py-1.5 rounded-xl bg-[#294a7a] text-white border border-[#d4af37]/40">
                                لوحة التحكم 🔒
                            </button>
                        </div>
                    </header>

                    {showModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border-2 border-[#d4af37]">
                                <h3 className="font-bold mb-2 text-[#1b365d]">كلمة مرور لوحة التحكم</h3>
                                <form onSubmit={handleAdminLogin}>
                                    <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="أدخل كلمة السر..." className="w-full border p-3 rounded-xl mb-2 text-black" autoFocus />
                                    {error && <p className="text-red-600 text-xs mb-2 font-bold">كلمة السر غير صحيحة!</p>}
                                    <div className="flex justify-end gap-2 mt-4">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 bg-gray-200 rounded-xl text-sm">إلغاء</button>
                                        <button type="submit" className="px-4 py-2 pharaoh-btn rounded-xl text-sm">دخول</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 p-4 max-w-4xl mx-auto w-full">
                        {tab === 'grocery' && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-[#1b365d]">𓍝 السلع الغذائية</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {Object.entries(products.grocery).map(([k, item]) => (
                                        <div key={k} className="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                                            <div>
                                                <h4 className="font-bold">{item.name}</h4>
                                                <p className="text-[#1b365d] text-sm font-semibold">{item.price} ج.م</p>
                                            </div>
                                            <button onClick={() => addToCart(k, item)} className="pharaoh-btn px-3 py-1.5 rounded-lg text-xs">إضافة للسلة</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'cosmetics' && (
                            <div>
                                <h2 className="text-lg font-bold mb-3 text-[#1b365d]">𓁷 أدوات التجميل والعناية</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {Object.entries(products.cosmetics).map(([k, item]) => (
                                        <div key={k} className="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                                            <div>
                                                <h4 className="font-bold">{item.name}</h4>
                                                <p className="text-[#1b365d] text-sm font-semibold">{item.price} ج.م</p>
                                            </div>
                                            <button onClick={() => addToCart(k, item)} className="pharaoh-btn px-3 py-1.5 rounded-lg text-xs">إضافة للسلة</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'cart' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border">
                                <h2 className="text-lg font-bold mb-4 text-[#1b365d]">🛒 سلة المشتريات</h2>
                                {cart.length === 0 ? (
                                    <p className="text-gray-500 text-center py-4">السلة فارغة حالياً.</p>
                                ) : (
                                    <div className="space-y-3">
                                        {cart.map(i => (
                                            <div key={i.key} className="flex justify-between items-center border-b pb-2 text-sm">
                                                <div>
                                                    <span className="font-bold">{i.name}</span>
                                                    <p className="text-xs text-gray-500">{i.price} ج.م × {i.qty}</p>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => updateQty(i.key, -1)} className="bg-gray-200 px-2 py-0.5 rounded font-bold">-</button>
                                                    <span>{i.qty}</span>
                                                    <button onClick={() => updateQty(i.key, 1)} className="bg-gray-200 px-2 py-0.5 rounded font-bold">+</button>
                                                </div>
                                            </div>
                                        ))}
                                        <div className="pt-3 flex justify-between items-center font-bold text-base">
                                            <span>الإجمالي النهائي:</span>
                                            <span className="text-[#1b365d] text-xl">{getTotal()} ج.م</span>
                                        </div>
                                        <button onClick={sendWhatsApp} className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold mt-3 shadow-md">إرسال الطلب عبر الواتساب</button>
                                    </div>
                                )}
                            </div>
                        )}

                        {tab === 'admin' && isAdmin && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border space-y-4">
                                <h2 className="text-lg font-bold text-[#1b365d]">🛠️ لوحة تحكم المالك والمشتركين</h2>
                                <div className="border-t pt-3">
                                    <h4 className="font-bold text-sm mb-2 text-gray-700">مشتركو اللياقة البدنية المسجلون:</h4>
                                    {subscribers.map(sub => (
                                        <div key={sub.id} className="bg-gray-50 p-3 rounded-xl border flex justify-between items-center text-xs mb-2">
                                            <div>
                                                <span className="font-bold">{sub.name}</span> ({sub.phone})
                                                <p className="text-gray-500">الباقة: {sub.plan}</p>
                                            </div>
                                            <a href={`https://wa.me/${sub.phone}`} target="_blank" className="bg-emerald-600 text-white px-3 py-1 rounded-lg">مراسلة</a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'fitness' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border text-center">
                                <h2 className="text-lg font-bold mb-2 text-[#1b365d]">𓃭 قسم اللياقة البدنية والاشتراكات</h2>
                                <p className="text-gray-600 text-sm mb-4">اطلب برنامجك التدريبي والغذائي المخصص لهدفك الآن.</p>
                                <a href={`https://wa.me/${OWNER_WHATSAPP_NUMBER}?text=مرحباً، أرجو تفعيل اشتراكي في قسم اللياقة البدنية`} target="_blank" className="pharaoh-btn px-6 py-2.5 rounded-xl inline-block text-sm shadow-md">تفعيل الاشتراك عبر الواتساب</a>
                            </div>
                        )}
                    </main>

                    <footer className="pharaoh-header text-white text-center p-3 text-xs mt-auto">
                        جميع الحقوق محفوظة لتطبيق شنوت - SHENUT &copy; 2026 𓋹
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
